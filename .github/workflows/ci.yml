# CI for the reno_order app (Part 17).
#
#   push / pull request ─► build a Frappe v16 bench with ERPNext ─► install the app on a fresh site
#                       ─► run the whole test suite ─► result (green / red) on the commit or PR
#
# Promotion to staging and production, and rollback, are described in docs/ci-cd.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Server tests (Frappe v16 + ERPNext)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Throwaway databases for this run only. The root password is a test-only value for a container
    # that exists for a few minutes; no real credentials are used anywhere in CI.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -proot" --health-interval=5s --health-timeout=2s --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Build a Frappe v16 bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets \
            --python "$(which python)" ~/frappe-bench

      - name: Get ERPNext and this app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 --skip-assets erpnext
          bench get-app --skip-assets reno_order "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create a fresh test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin \
            --install-app erpnext --install-app reno_order
          bench --site test_site set-config allow_tests true

      # reno_order's before_tests hook completes ERPNext's setup wizard on this empty site.
      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app reno_order
